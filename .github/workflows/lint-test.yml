name: Lint & Test

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

jobs:
  lint-test:
    name: Ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Ruff lint
        run: uv run --with ruff ruff check custom_components tests

      - name: Ruff format check
        run: uv run --with ruff ruff format --check custom_components tests

      - name: Pytest
        run: uv run --with pytest pytest -q
