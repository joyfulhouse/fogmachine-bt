  <!-- wordmark -->
  <g font-family="Helvetica, Arial, sans-serif" font-weight="700">
    <text x="292" y="140" font-size="64" fill="#123A54">Fog</text>
    <text x="404" y="140" font-size="64" fill="#41BDF5">Machine</text>
    <text x="294" y="176" font-size="22" letter-spacing="5" font-weight="500" fill="#5B7285">LOCAL BLUETOOTH</text>
