[project]
name = "fogmachine-bt"
version = "0.1.0"
description = "Home Assistant local-BLE integration for FG-series fog / misting machines"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Bryan Li" }]
dependencies = [
    # Runtime deps of the HA integration are declared in the component's
    # manifest.json (HA installs them). Listed here for standalone/dev use.
    "bleak-retry-connector>=3.5.0",
    "bleak>=0.22",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.uv]
package = false
